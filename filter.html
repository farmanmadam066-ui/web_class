<html>
<head>
      <title>CSS filter example</title>
	  
	  <style>
	       img {
		         width: 300px;
				 filter: grayscale(100%);
				 transition: 0.5s;
				}
           img:hover {
                filter: grayscale(0%) brightness(120%);
                }
        </style>				
</head>
<body>
        <h2>TOYOTA FORTUNER</h2>
		
		<img src="fortuner.png" alt="fortuner">
</body>		
</html>
